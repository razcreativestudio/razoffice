<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definisi Gradien Emas Metalik Khas RAZ Office -->
  <defs>
    <linearGradient id="razGold" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F8E5A8" />
      <stop offset="25%" stop-color="#DEB76A" />
      <stop offset="50%" stop-color="#C4963C" />
      <stop offset="75%" stop-color="#EED792" />
      <stop offset="100%" stop-color="#9C7122" />
    </linearGradient>
  </defs>

  <!-- Grup Ikon Tumpukan Dokumen Isometrik (4 Lembar) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Lembar 4 (Paling Bawah) -->
    <path
      d="M 72 141 L 46 156 L 122 198 L 206 151 L 182 138"
      stroke="url(#razGold)"
      stroke-width="7"
    />

    <!-- Lembar 3 (Lapisan Ketiga) -->
    <path
      d="M 72 123 L 46 138 L 122 180 L 206 133 L 182 120"
      stroke="url(#razGold)"
      stroke-width="7"
    />

    <!-- Lembar 2 (Lapisan Kedua) -->
    <path
      d="M 72 105 L 46 120 L 122 162 L 206 115 L 182 102"
      stroke="url(#razGold)"
      stroke-width="7"
    />

    <!-- Lembar 1 (Lembar Utama Atas dengan Sudut Terlipat) -->
    <path
      d="M 46 102 L 134 52 L 180 79 L 180 112 L 122 144 Z"
      stroke="url(#razGold)"
      stroke-width="7"
    />

    <!-- Lipatan Sudut Kanan Atas (Dog-Ear Flap) -->
    <path
      d="M 180 79 L 206 94 L 206 112 L 180 112"
      stroke="url(#razGold)"
      stroke-width="7"
    />
  </g>
</svg>
